name: 更新站点

# 定时扫一遍各平台，有新投稿就自动重建并上线。
# 也可以在 Actions 页面手动触发（workflow_dispatch）。
on:
  schedule:
    # 每 20 分钟一次。网易云的音频直链带签名、**实测约 30 分钟内失效，所以要靠频繁重建来保持链接新鲜。
    # 定时用 UTC，北京时间需 -8。
    - cron: "3,23,43 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # 站点产物与快照由本工作流自己生成，不用因此触发重建
    paths-ignore:
      - "dist/**"
      - "data/snapshot.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 先探一下 Pages 是否已启用。这一步纯诊断：
      # 创建 Pages 站点需要仓库管理员权限，GITHUB_TOKEN 没有（即使带 pages: write 也会 403），
      # 所以只能在没启用时给出明确指引，而不是默默失败。
      - name: 检查 Pages 是否已启用
        continue-on-error: true
        run: |
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          echo "GET /pages -> $code"
          if [ "$code" = "404" ]; then
            mkdir -p data
            printf '{\n "pagesEnabled": false,\n "checkedAt": "%s",\n "action": "请在 Settings - Pages - Source 选择 GitHub Actions，然后重跑一次本工作流"\n}\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/pages-status.json
            {
              echo "## ⚠️ GitHub Pages 尚未启用 —— 站点还没有发布"
              echo ""
              echo "创建 Pages 站点需要仓库管理员权限，工作流里的 GITHUB_TOKEN 没有该权限，"
              echo "因此这一步只能手动完成（一次性，之后自动部署一直有效）。"
              echo ""
              echo "1. 打开 https://github.com/${{ github.repository }}/settings/pages"
              echo "2. 在 **Build and deployment → Source** 选择 **GitHub Actions**，保存"
              echo "3. 回到 Actions 页面点一次 **Run workflow**"
              echo ""
              echo "站点地址将是 https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f data/pages-status.json
            echo "Pages 已启用，继续部署。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集三平台数据
        env:
          # 可选：B 站需要登录态时填在仓库 Secrets 里（当前方案不需要）
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
        run: python scripts/collect_all.py

      - name: 处理封面资源
        run: python scripts/build_assets.py

      - name: 生成分享卡片
        run: python scripts/build_og.py

      - name: 渲染站点
        run: python scripts/build_site.py

      - name: 字体子集化
        run: python scripts/build_font.py

      - name: 提交快照与封面（让下次构建能复用缓存、也保留内容变更历史）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data src/assets
          if git diff --cached --quiet; then
            echo "内容无变化"
          else
            git commit -m "chore: 自动更新内容快照与资源 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # enablement: true 只在有权限时才会真正建站；没权限时会失败，
      # 但上面的诊断步骤已经把指引写进 Step Summary 了。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
